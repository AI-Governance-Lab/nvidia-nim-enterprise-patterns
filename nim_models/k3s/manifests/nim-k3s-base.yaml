apiVersion: v1
kind: Namespace
metadata:
  name: nim-serving
  labels:
    app.kubernetes.io/part-of: nvidia-nim-enterprise-patterns
    governance.aigovlab.io/tier: inference
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nim-model-cache-pvc
  namespace: nim-serving
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  # Adjust storageClassName for your K3s environment (e.g., local-path or nfs-client)
  storageClassName: local-path
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nim-inference-ingress
  namespace: nim-serving
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: nim.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nim-llm
                port:
                  number: 8000
